name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  node16-compatibility:
    name: Node 16 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Validate Skill workflow contracts
        run: npm run validate:skill-contracts

      - name: Test Skill workflow contract validation
        run: npm run test:skill-contracts

      - name: Test CLI argument validation
        run: npm run test:cli

      - name: Test catalog validation guards
        run: npm run test:catalog

  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate catalog
        run: npm run validate

      - name: Verify pinned Agent references
        run: npm run verify:agent-references:remote
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Audit Agent originality
        run: npm run audit:agent-originality

      - name: Smoke test CLI
        run: |
          node autoverse-cli.js --help
          node autoverse-cli.js list
          node autoverse-cli.js search python
          node autoverse-cli.js info python-development

      - name: Test CLI argument validation
        run: npm run test:cli

      - name: Test catalog validation guards
        run: npm run test:catalog

      - name: Test Skill workflow contract validation
        run: npm run test:skill-contracts

  installer-powershell:
    name: Installer smoke (PowerShell)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run isolated PowerShell installer smoke test
        run: npm run smoke:install:powershell

  installer-bash:
    name: Installer smoke (Bash)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run isolated Bash installer smoke test
        run: npm run smoke:install:bash
