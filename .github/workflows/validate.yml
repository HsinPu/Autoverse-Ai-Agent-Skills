name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate catalog
        run: npm run validate

      - name: Verify pinned Agent references
        run: npm run verify:agent-references:remote
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Audit Agent originality
        run: npm run audit:agent-originality

      - name: Smoke test CLI
        run: |
          node autoverse-cli.js --help
          node autoverse-cli.js list
          node autoverse-cli.js search python
          node autoverse-cli.js info python-development
